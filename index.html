<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Countdown · View</title>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js">
    </script>
    <style>
        /* same as before */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #0b0e1a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            padding: 1.5rem;
            background-image:
                radial-gradient(ellipse at 20% 50%, rgba(72, 49, 212, 0.15) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 50%, rgba(212, 49, 130, 0.10) 0%, transparent 60%),
                radial-gradient(ellipse at 50% 100%, rgba(49, 212, 200, 0.06) 0%, transparent 50%);
        }
        .app {
            width: 100%;
            max-width: 720px;
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-radius: 3rem;
            padding: 2rem 2rem 2.2rem;
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.05);
            transition: all 0.3s ease;
        }
        .header {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-weight: 600;
            font-size: 1.1rem;
            letter-spacing: 0.02em;
            color: rgba(255, 255, 255, 0.7);
        }
        .logo svg {
            width: 24px;
            height: 24px;
            fill: none;
            stroke: #7c7cf8;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .timer-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0.8rem 0 0.2rem;
        }
        .timer {
            font-family: 'SF Mono', 'Fira Code', 'JetBrains Mono', 'Cascadia Code', monospace;
            font-size: clamp(3.2rem, 15vw, 6rem);
            font-weight: 300;
            letter-spacing: 0.04em;
            color: #fff;
            text-shadow: 0 0 40px rgba(124, 124, 248, 0.15), 0 0 80px rgba(124, 124, 248, 0.05);
            display: flex;
            align-items: baseline;
            gap: 0.05em;
            line-height: 1.2;
            user-select: none;
        }
        .timer .ms {
            font-size: 0.45em;
            font-weight: 300;
            color: rgba(255, 255, 255, 0.45);
            margin-left: 0.2em;
            min-width: 1.6em;
            text-align: left;
        }
        .timer .separator {
            color: rgba(255, 255, 255, 0.2);
            font-weight: 200;
            margin: 0 0.02em;
        }
        .timer .hours {
            min-width: 2ch;
            text-align: right;
        }
        .timer .minutes {
            min-width: 2ch;
            text-align: right;
        }
        .timer .seconds {
            min-width: 2ch;
            text-align: right;
        }
        .status-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.6rem;
            margin-top: 0.1rem;
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.35);
            letter-spacing: 0.02em;
        }
        .status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #4ade80;
            animation: pulse-dot 1.6s ease-in-out infinite;
        }
        .status-dot.paused {
            background: #facc15;
            animation: none;
        }
        .status-dot.finished {
            background: #f87171;
            animation: none;
        }
        @keyframes pulse-dot {
            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.3;
                transform: scale(0.7);
            }
        }
        .info-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 0.8rem 1.5rem;
            margin-top: 1rem;
            padding: 0.7rem 1rem;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 1.5rem;
            border: 1px solid rgba(255, 255, 255, 0.04);
            font-size: 0.9rem;
        }
        .info-item {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            color: rgba(255, 255, 255, 0.6);
        }
        .info-item .label {
            font-weight: 400;
            opacity: 0.7;
        }
        .info-item .value {
            font-weight: 500;
            color: #fff;
            font-variant-numeric: tabular-nums;
        }
        .info-item .value.finished {
            color: #f87171;
            font-weight: 600;
        }
        @media (max-width: 600px) {
            .app { padding: 1.2rem; border-radius: 2rem; }
            .timer { font-size: clamp(2.4rem, 12vw, 4rem); }
            .info-grid { flex-direction: column; align-items: stretch; gap: 0.6rem; padding: 0.8rem; }
            .info-item { justify-content: space-between; }
        }
    </style>
</head>
<body>
    <div class="app" role="main">
        <header class="header">
            <div class="logo">
                <svg viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="10" />
                    <polyline points="12 6 12 12 16 14" />
                </svg>
                <span>Countdown</span>
            </div>
        </header>
        <section>
            <div class="timer-wrapper">
                <div class="timer" id="timerDisplay">
                    <span class="hours" id="h">00</span>
                    <span class="separator">:</span>
                    <span class="minutes" id="m">00</span>
                    <span class="separator">:</span>
                    <span class="seconds" id="s">00</span>
                    <span class="ms" id="ms">.00</span>
                </div>
            </div>
            <div class="status-row">
                <span class="status-dot" id="statusDot"></span>
                <span id="statusLabel">Ready</span>
            </div>
            <div class="info-grid" id="infoGridView">
                <div class="info-item">
                    <span class="label">🕒 Egypt</span>
                    <span class="value" id="currentTimeView">--:--:--</span>
                </div>
                <div class="info-item">
                    <span class="label">⏳ Remaining</span>
                    <span class="value" id="remainingView">00:00:00</span>
                </div>
                <div class="info-item">
                    <span class="label">🏁 Finish at</span>
                    <span class="value" id="completionView">--:--</span>
                </div>
            </div>
        </section>
    </div>

    <script>
        // ============================================================
        //  FIREBASE CONFIG (REPLACE WITH YOUR OWN)
        // ============================================================
        const firebaseConfig = {
            apiKey: "AIzaSyB6sHNLOVLT4vlBh93VFNEWqOe21XuMvTg",
            authDomain: "timer-47497.firebaseapp.com",
            databaseURL: "https://timer-47497-default-rtdb.firebaseio.com",
            projectId: "timer-47497",
            storageBucket: "timer-47497.firebasestorage.app",
            messagingSenderId: "745059565421",
            appId: "1:745059565421:web:0c893aec7c73bdcef9a464",
            measurementId: "G-KL3T9ZQ1J4"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const timerRef = db.ref('countdown');

        // ============================================================
        //  VIEW ENGINE – READ ONLY WITH LOCAL TICKING
        // ============================================================

        const hEl = document.getElementById('h');
        const mEl = document.getElementById('m');
        const sEl = document.getElementById('s');
        const msEl = document.getElementById('ms');
        const dotEl = document.getElementById('statusDot');
        const labelEl = document.getElementById('statusLabel');
        const currentTimeView = document.getElementById('currentTimeView');
        const remainingView = document.getElementById('remainingView');
        const completionView = document.getElementById('completionView');

        let localRemaining = 0;
        let localInitial = 0;
        let localRunning = false;
        let localStartTime = 0;
        let intervalId = null;

        function pad(n, d = 2) { return String(n).padStart(d, '0'); }

        function formatTime(ms) {
            const total = Math.max(0, ms);
            const hrs = Math.floor(total / 3600000);
            const mins = Math.floor((total % 3600000) / 60000);
            const secs = Math.floor((total % 60000) / 1000);
            const millis = Math.floor((total % 1000) / 10);
            return { h: pad(hrs), m: pad(mins), s: pad(secs), ms: pad(millis) };
        }

        function updateTimerDisplay(remaining) {
            const t = formatTime(remaining);
            hEl.textContent = t.h;
            mEl.textContent = t.m;
            sEl.textContent = t.s;
            msEl.textContent = '.' + t.ms;
            remainingView.textContent = `${t.h}:${t.m}:${t.s}`;
        }

        function updateStatus(running, remaining, initial) {
            const isFinished = remaining === 0 && initial > 0;
            let statusText = 'Ready';
            let dotClass = 'status-dot';
            if (running) {
                statusText = 'Running';
                dotClass += ' running';
            } else if (isFinished) {
                statusText = '🎉 Time\'s up!';
                dotClass += ' finished';
            } else if (remaining > 0) {
                statusText = 'Paused';
                dotClass += ' paused';
            } else {
                statusText = 'Set a target';
                dotClass += ' paused';
            }
            labelEl.textContent = statusText;
            dotEl.className = dotClass;
        }

        function updateCompletion(remaining, initial) {
            const now = new Date();
            const egyptTime = new Date(now.toLocaleString('en-US', { timeZone: 'Africa/Cairo' }));
            currentTimeView.textContent = egyptTime.toTimeString().slice(0, 8);

            if (remaining <= 0 && initial > 0) {
                completionView.textContent = '🎉 Time\'s up!';
                completionView.className = 'value finished';
                return;
            }
            if (remaining <= 0) {
                completionView.textContent = 'Set a target';
                completionView.className = 'value';
                return;
            }
            const finishDate = new Date(egyptTime.getTime() + remaining);
            completionView.textContent = finishDate.toTimeString().slice(0, 8);
            completionView.className = 'value';
        }

        function tick() {
            if (!localRunning) return;
            const elapsed = performance.now() - localStartTime;
            let newRemaining = localInitial - elapsed;
            if (newRemaining <= 0) {
                newRemaining = 0;
                localRunning = false;
                clearInterval(intervalId);
                intervalId = null;
                updateTimerDisplay(0);
                updateStatus(false, 0, localInitial);
                updateCompletion(0, localInitial);
                return;
            }
            localRemaining = newRemaining;
            updateTimerDisplay(newRemaining);
            // Update completion time (it's updated every second separately)
        }

        function applyRemoteState(data) {
            const newRunning = data.running || false;
            let newRemaining;
            if (newRunning) {
                const now = Date.now();
                const elapsed = now - (data.lastUpdated || now);
                newRemaining = Math.max(0, data.remaining - elapsed);
            } else {
                newRemaining = Math.max(0, data.remaining);
            }
            const newInitial = data.initialRemaining || 0;

            if (intervalId) {
                clearInterval(intervalId);
                intervalId = null;
            }

            localRemaining = newRemaining;
            localInitial = newInitial;
            localRunning = newRunning;

            if (localRunning && localRemaining > 0) {
                localStartTime = performance.now() - (localInitial - localRemaining);
                intervalId = setInterval(tick, 20);
            } else {
                localRunning = false;
            }

            updateTimerDisplay(localRemaining);
            updateStatus(localRunning, localRemaining, localInitial);
            updateCompletion(localRemaining, localInitial);
        }

        timerRef.on('value', (snapshot) => {
            const data = snapshot.val();
            if (data) {
                applyRemoteState(data);
            } else {
                const now = new Date();
                const egyptTime = new Date(now.toLocaleString('en-US', { timeZone: 'Africa/Cairo' }));
                currentTimeView.textContent = egyptTime.toTimeString().slice(0, 8);
                localRemaining = 0;
                localInitial = 0;
                localRunning = false;
                if (intervalId) { clearInterval(intervalId);
                    intervalId = null; }
                updateTimerDisplay(0);
                updateStatus(false, 0, 0);
                updateCompletion(0, 0);
            }
        });

        // Update clock and completion every second
        setInterval(() => {
            const now = new Date();
            const egyptTime = new Date(now.toLocaleString('en-US', { timeZone: 'Africa/Cairo' }));
            currentTimeView.textContent = egyptTime.toTimeString().slice(0, 8);
            // Refresh completion time (especially when paused)
            updateCompletion(localRemaining, localInitial);
        }, 1000);

        timerRef.once('value');
    </script>
</body>
</html>
