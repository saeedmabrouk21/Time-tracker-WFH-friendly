<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Countdown Timer · Multi‑device Sync</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js">
    </script>
    <style>
        /* ----- CSS (unchanged from previous) ----- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #0b0e1a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            padding: 1.5rem;
            background-image:
                radial-gradient(ellipse at 20% 50%, rgba(72, 49, 212, 0.15) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 50%, rgba(212, 49, 130, 0.10) 0%, transparent 60%),
                radial-gradient(ellipse at 50% 100%, rgba(49, 212, 200, 0.06) 0%, transparent 50%);
        }

        .app {
            width: 100%;
            max-width: 760px;
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-radius: 3rem;
            padding: 2rem 2rem 2.2rem;
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.05);
            transition: all 0.3s ease;
        }

        .nav-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-weight: 600;
            font-size: 1.1rem;
            letter-spacing: 0.02em;
            color: rgba(255, 255, 255, 0.7);
        }

        .logo svg {
            width: 24px;
            height: 24px;
            fill: none;
            stroke: #7c7cf8;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .nav-links {
            display: flex;
            gap: 0.4rem;
            background: rgba(255, 255, 255, 0.05);
            padding: 0.3rem;
            border-radius: 2rem;
        }

        .nav-link {
            padding: 0.5rem 1.2rem;
            border: none;
            border-radius: 1.6rem;
            background: transparent;
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.25s ease;
            letter-spacing: 0.01em;
            text-decoration: none;
            display: inline-block;
        }

        .nav-link:hover {
            color: rgba(255, 255, 255, 0.8);
        }

        .nav-link.active {
            background: rgba(124, 124, 248, 0.25);
            color: #fff;
            box-shadow: 0 0 20px rgba(124, 124, 248, 0.08);
        }

        .page {
            display: none;
            animation: fadeUp 0.4s ease;
        }

        .page.active {
            display: block;
        }

        @keyframes fadeUp {
            0% {
                opacity: 0;
                transform: translateY(12px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .timer-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0.8rem 0 0.2rem;
        }

        .timer {
            font-family: 'SF Mono', 'Fira Code', 'JetBrains Mono', 'Cascadia Code', monospace;
            font-size: clamp(3.2rem, 15vw, 6rem);
            font-weight: 300;
            letter-spacing: 0.04em;
            color: #fff;
            text-shadow: 0 0 40px rgba(124, 124, 248, 0.15), 0 0 80px rgba(124, 124, 248, 0.05);
            display: flex;
            align-items: baseline;
            gap: 0.05em;
            line-height: 1.2;
            user-select: none;
        }

        .timer .ms {
            font-size: 0.45em;
            font-weight: 300;
            color: rgba(255, 255, 255, 0.45);
            margin-left: 0.2em;
            min-width: 1.6em;
            text-align: left;
        }

        .timer .separator {
            color: rgba(255, 255, 255, 0.2);
            font-weight: 200;
            margin: 0 0.02em;
        }

        .timer .hours {
            min-width: 2ch;
            text-align: right;
        }
        .timer .minutes {
            min-width: 2ch;
            text-align: right;
        }
        .timer .seconds {
            min-width: 2ch;
            text-align: right;
        }

        .status-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.6rem;
            margin-top: 0.1rem;
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.35);
            letter-spacing: 0.02em;
        }

        .status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #4ade80;
            animation: pulse-dot 1.6s ease-in-out infinite;
        }

        .status-dot.paused {
            background: #facc15;
            animation: none;
        }

        .status-dot.finished {
            background: #f87171;
            animation: none;
        }

        @keyframes pulse-dot {
            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.3;
                transform: scale(0.7);
            }
        }

        .info-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 0.8rem 1.5rem;
            margin-top: 1rem;
            padding: 0.7rem 1rem;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 1.5rem;
            border: 1px solid rgba(255, 255, 255, 0.04);
            font-size: 0.9rem;
        }

        .info-item {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            color: rgba(255, 255, 255, 0.6);
        }

        .info-item .label {
            font-weight: 400;
            opacity: 0.7;
        }

        .info-item .value {
            font-weight: 500;
            color: #fff;
            font-variant-numeric: tabular-nums;
        }

        .info-item .value.completed {
            color: #4ade80;
        }

        .info-item .value.finished {
            color: #f87171;
            font-weight: 600;
        }

        .target-input {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 0.6rem;
            color: #fff;
            padding: 0.25rem 0.4rem;
            width: 3.8rem;
            font-size: 0.9rem;
            font-weight: 500;
            text-align: center;
            outline: none;
            transition: border 0.2s;
        }

        .target-input:focus {
            border-color: #7c7cf8;
        }

        .target-input::-webkit-inner-spin-button {
            -webkit-appearance: none;
        }

        .target-input[type="number"] {
            -moz-appearance: textfield;
        }

        .set-btn {
            background: rgba(96, 165, 250, 0.15);
            color: #60a5fa;
            border: 1px solid rgba(96, 165, 250, 0.15);
            padding: 0.3rem 0.9rem;
            border-radius: 1.2rem;
            font-weight: 500;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
        }

        .set-btn:hover {
            background: rgba(96, 165, 250, 0.25);
            box-shadow: 0 0 20px rgba(96, 165, 250, 0.10);
            transform: scale(1.02);
        }

        .set-btn:active {
            transform: scale(0.95);
        }

        .controls-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 0.9rem;
            margin-top: 1.5rem;
        }

        .ctrl-btn {
            padding: 0.9rem 0.3rem;
            border: none;
            border-radius: 1.4rem;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            letter-spacing: 0.02em;
            background: rgba(255, 255, 255, 0.06);
            color: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.04);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0.1rem;
            font-family: inherit;
        }

        .ctrl-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
        }

        .ctrl-btn:active {
            transform: translateY(0px) scale(0.97);
        }

        .ctrl-btn .icon {
            font-size: 1.2rem;
            line-height: 1.2;
        }

        .ctrl-btn .label {
            font-size: 0.7rem;
            opacity: 0.7;
        }

        .ctrl-btn.pause {
            background: rgba(250, 204, 21, 0.18);
            color: #facc15;
            border-color: rgba(250, 204, 21, 0.15);
        }
        .ctrl-btn.pause:hover {
            background: rgba(250, 204, 21, 0.28);
            box-shadow: 0 8px 30px rgba(250, 204, 21, 0.10);
        }

        .ctrl-btn.continue-btn {
            background: rgba(74, 222, 128, 0.15);
            color: #4ade80;
            border-color: rgba(74, 222, 128, 0.12);
        }
        .ctrl-btn.continue-btn:hover {
            background: rgba(74, 222, 128, 0.25);
            box-shadow: 0 8px 30px rgba(74, 222, 128, 0.10);
        }

        .ctrl-btn.reset {
            background: rgba(248, 113, 113, 0.14);
            color: #f87171;
            border-color: rgba(248, 113, 113, 0.10);
        }
        .ctrl-btn.reset:hover {
            background: rgba(248, 113, 113, 0.24);
            box-shadow: 0 8px 30px rgba(248, 113, 113, 0.10);
        }

        .ctrl-btn.add-hours {
            background: rgba(96, 165, 250, 0.14);
            color: #60a5fa;
            border-color: rgba(96, 165, 250, 0.10);
        }
        .ctrl-btn.add-hours:hover {
            background: rgba(96, 165, 250, 0.24);
            box-shadow: 0 8px 30px rgba(96, 165, 250, 0.10);
        }

        .ctrl-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }

        .view-hint {
            text-align: center;
            margin-top: 1.2rem;
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.2);
            letter-spacing: 0.04em;
        }

        .view-hint span {
            display: inline-block;
            padding: 0.3rem 1rem;
            border-radius: 2rem;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .view-hint a {
            color: #7c7cf8;
            text-decoration: none;
        }

        /* Responsive */
        @media (max-width: 600px) {
            .app {
                padding: 1.2rem 1.2rem 1.6rem;
                border-radius: 2rem;
            }
            .nav-bar {
                flex-direction: column;
                gap: 0.8rem;
                align-items: stretch;
            }
            .logo {
                justify-content: center;
            }
            .nav-links {
                justify-content: center;
            }
            .nav-link {
                padding: 0.4rem 1rem;
                font-size: 0.8rem;
                flex: 1;
                text-align: center;
            }
            .timer {
                font-size: clamp(2.4rem, 12vw, 4rem);
            }
            .controls-grid {
                grid-template-columns: 1fr 1fr;
                gap: 0.6rem;
            }
            .ctrl-btn {
                padding: 0.7rem 0.3rem;
                font-size: 0.85rem;
                flex-direction: row;
            }
            .ctrl-btn .label {
                font-size: 0.8rem;
            }
            .info-grid {
                flex-direction: column;
                align-items: stretch;
                gap: 0.6rem;
                padding: 0.8rem;
            }
            .info-item {
                justify-content: space-between;
            }
            .target-input {
                width: 3.5rem;
            }
        }

        @media (max-width: 400px) {
            .controls-grid {
                grid-template-columns: 1fr 1fr;
                gap: 0.5rem;
            }
            .ctrl-btn {
                font-size: 0.75rem;
                padding: 0.5rem 0.2rem;
                border-radius: 1rem;
            }
            .ctrl-btn .icon {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>

    <div class="app" role="main">
        <!-- Navigation -->
        <nav class="nav-bar">
            <div class="logo">
                <svg viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="10" />
                    <polyline points="12 6 12 12 16 14" />
                </svg>
                <span>Countdown</span>
            </div>
            <div class="nav-links">
                <a class="nav-link active" data-page="view" href="#view">👁 View</a>
                <a class="nav-link" data-page="controls" href="#control">🎮 Controls</a>
            </div>
        </nav>

        <!-- ===== VIEW PAGE ===== -->
        <section class="page active" id="page-view" data-page="view">
            <div class="timer-wrapper">
                <div class="timer" id="timerDisplay">
                    <span class="hours" id="h">00</span>
                    <span class="separator">:</span>
                    <span class="minutes" id="m">00</span>
                    <span class="separator">:</span>
                    <span class="seconds" id="s">00</span>
                    <span class="ms" id="ms">.00</span>
                </div>
            </div>
            <div class="status-row">
                <span class="status-dot" id="statusDot"></span>
                <span id="statusLabel">Ready</span>
            </div>
            <div class="info-grid" id="infoGridView">
                <div class="info-item">
                    <span class="label">🕒 Egypt</span>
                    <span class="value" id="currentTimeView">--:--:--</span>
                </div>
                <div class="info-item">
                    <span class="label">⏳ Remaining</span>
                    <span class="value" id="remainingView">00:00:00</span>
                </div>
                <div class="info-item">
                    <span class="label">🏁 Finish at</span>
                    <span class="value" id="completionView">--:--</span>
                </div>
            </div>
            <div class="view-hint">
                <span>👁 View-only · switch to <a href="#control">Controls</a> to set &amp; run</span>
            </div>
        </section>

        <!-- ===== CONTROLS PAGE ===== -->
        <section class="page" id="page-controls" data-page="controls">
            <div class="timer-wrapper">
                <div class="timer" id="timerDisplayCtrl">
                    <span class="hours" id="hCtrl">00</span>
                    <span class="separator">:</span>
                    <span class="minutes" id="mCtrl">00</span>
                    <span class="separator">:</span>
                    <span class="seconds" id="sCtrl">00</span>
                    <span class="ms" id="msCtrl">.00</span>
                </div>
            </div>
            <div class="status-row">
                <span class="status-dot" id="statusDotCtrl"></span>
                <span id="statusLabelCtrl">Ready</span>
            </div>
            <div class="info-grid" id="infoGridCtrl">
                <div class="info-item">
                    <span class="label">🕒 Egypt</span>
                    <span class="value" id="currentTimeCtrl">--:--:--</span>
                </div>
                <div class="info-item">
                    <span class="label">🎯 Set countdown</span>
                    <input type="number" class="target-input" id="setHours" value="0" min="0" max="99" placeholder="H" />
                    <span style="color:rgba(255,255,255,0.4);">h</span>
                    <input type="number" class="target-input" id="setMinutes" value="5" min="0" max="59" placeholder="M" />
                    <span style="color:rgba(255,255,255,0.4);">m</span>
                    <button class="set-btn" id="btnSetTarget">Set</button>
                </div>
                <div class="info-item">
                    <span class="label">🏁 Finish at</span>
                    <span class="value" id="completionCtrl">--:--</span>
                </div>
            </div>
            <div class="controls-grid">
                <button class="ctrl-btn pause" id="btnPause" disabled>
                    <span class="icon">⏸</span>
                    <span class="label">Pause</span>
                </button>
                <button class="ctrl-btn continue-btn" id="btnContinue" disabled>
                    <span class="icon">▶</span>
                    <span class="label">Continue</span>
                </button>
                <button class="ctrl-btn reset" id="btnReset">
                    <span class="icon">⟳</span>
                    <span class="label">Reset</span>
                </button>
                <button class="ctrl-btn add-hours" id="btnAddHours">
                    <span class="icon">⏰</span>
                    <span class="label">+8 Hours</span>
                </button>
            </div>
        </section>
    </div>

    <script>
        // ============================================================
        //  FIREBASE CONFIG – REPLACE WITH YOUR OWN
        // ============================================================
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT.firebaseapp.com",
            databaseURL: "https://YOUR_PROJECT-default-rtdb.firebaseio.com",
            projectId: "YOUR_PROJECT",
            storageBucket: "YOUR_PROJECT.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const timerRef = db.ref('countdown');
        const clientId = Math.random().toString(36).substring(2, 10); // unique per device/tab

        // ============================================================
        //  COUNTDOWN ENGINE (with robust sync)
        // ============================================================

        class CountdownTimer {
            constructor() {
                // State
                this.remaining = 0; // ms
                this.initialRemaining = 0; // ms
                this.running = false;
                this.intervalId = null;
                this.startTime = 0; // performance.now() when started locally
                this.localUpdate = false; // prevent echo

                // DOM refs
                this.hEl = document.getElementById('h');
                this.mEl = document.getElementById('m');
                this.sEl = document.getElementById('s');
                this.msEl = document.getElementById('ms');
                this.dotEl = document.getElementById('statusDot');
                this.labelEl = document.getElementById('statusLabel');

                this.hCtrl = document.getElementById('hCtrl');
                this.mCtrl = document.getElementById('mCtrl');
                this.sCtrl = document.getElementById('sCtrl');
                this.msCtrl = document.getElementById('msCtrl');
                this.dotCtrl = document.getElementById('statusDotCtrl');
                this.labelCtrl = document.getElementById('statusLabelCtrl');

                this.btnPause = document.getElementById('btnPause');
                this.btnContinue = document.getElementById('btnContinue');
                this.btnReset = document.getElementById('btnReset');
                this.btnAddHours = document.getElementById('btnAddHours');
                this.btnSetTarget = document.getElementById('btnSetTarget');

                this.setHours = document.getElementById('setHours');
                this.setMinutes = document.getElementById('setMinutes');

                this.currentTimeView = document.getElementById('currentTimeView');
                this.currentTimeCtrl = document.getElementById('currentTimeCtrl');
                this.remainingView = document.getElementById('remainingView');
                this.completionView = document.getElementById('completionView');
                this.completionCtrl = document.getElementById('completionCtrl');

                // Bind methods
                this.updateDisplay = this.updateDisplay.bind(this);
                this.tick = this.tick.bind(this);
                this.updateTimeAndCompletion = this.updateTimeAndCompletion.bind(this);
                this.syncToFirebase = this.syncToFirebase.bind(this);
                this.applyRemoteState = this.applyRemoteState.bind(this);

                // Load initial state
                this.loadFromFirebase();

                // Listen for remote changes
                timerRef.on('value', (snapshot) => {
                    const data = snapshot.val();
                    if (data && !this.localUpdate) {
                        this.applyRemoteState(data);
                    }
                });

                // UI events
                this.btnPause.addEventListener('click', () => this.pause());
                this.btnContinue.addEventListener('click', () => this.start());
                this.btnReset.addEventListener('click', () => this.reset());
                this.btnAddHours.addEventListener('click', () => this.addHours(8));
                this.btnSetTarget.addEventListener('click', () => {
                    const hrs = parseInt(this.setHours.value) || 0;
                    const mins = parseInt(this.setMinutes.value) || 0;
                    this.setTarget(hrs, mins);
                });

                this.setupRouting();

                // Update clock every second
                setInterval(this.updateTimeAndCompletion, 1000);
                this.updateTimeAndCompletion();
                this.updateUIState();
            }

            // ----- Firebase -----
            loadFromFirebase() {
                timerRef.once('value').then((snapshot) => {
                    const data = snapshot.val();
                    if (data) {
                        this.applyRemoteState(data);
                    } else {
                        // No data → set default 5 minutes
                        this.setTarget(0, 5);
                    }
                }).catch(err => {
                    console.warn("Firebase load failed, using defaults.", err);
                    this.setTarget(0, 5);
                });
            }

            applyRemoteState(data) {
                // Ignore if it's our own update (we set localUpdate = true before writing)
                if (data.clientId === clientId) return;

                // Stop local timer if running
                if (this.running) {
                    clearInterval(this.intervalId);
                    this.intervalId = null;
                    this.running = false;
                }

                const remoteRemaining = data.remaining || 0;
                const remoteInitial = data.initialRemaining || 0;
                const remoteRunning = data.running || false;
                const remoteLastUpdated = data.lastUpdated || 0;

                // Compute elapsed time since the remote snapshot
                // Use client's Date.now() - remoteLastUpdated (approximate)
                const now = Date.now();
                const elapsed = now - remoteLastUpdated;
                let newRemaining = Math.max(0, remoteRemaining - elapsed);

                // If remoteRunning is true, we need to start the timer with this newRemaining
                this.remaining = newRemaining;
                this.initialRemaining = remoteInitial;

                if (remoteRunning && newRemaining > 0) {
                    this.running = true;
                    this.startTime = performance.now() - (this.initialRemaining - this.remaining);
                    this.intervalId = setInterval(this.tick, 20);
                } else {
                    this.running = false;
                }

                this.updateDisplay();
                this.updateUIState();
                this.updateTimeAndCompletion();
            }

            syncToFirebase() {
                this.localUpdate = true;
                const data = {
                    remaining: this.remaining,
                    initialRemaining: this.initialRemaining,
                    running: this.running,
                    lastUpdated: firebase.database.ServerValue.TIMESTAMP,
                    clientId: clientId
                };
                timerRef.update(data).then(() => {
                    this.localUpdate = false;
                }).catch(err => {
                    console.warn("Firebase sync failed", err);
                    this.localUpdate = false;
                });
            }

            // ----- Core -----
            setTarget(hours, minutes) {
                const totalMs = (hours * 3600 + minutes * 60) * 1000;
                this.initialRemaining = totalMs;
                this.remaining = totalMs;
                this.pause(); // stop if running
                this.updateDisplay();
                this.updateTimeAndCompletion();
                this.updateUIState();
                this.setHours.value = hours;
                this.setMinutes.value = minutes;
                this.syncToFirebase();
            }

            start() {
                if (this.remaining <= 0) return;
                if (this.running) return;
                this.running = true;
                this.startTime = performance.now() - (this.initialRemaining - this.remaining);
                this.intervalId = setInterval(this.tick, 20);
                this.updateUIState();
                this.syncToFirebase();
            }

            pause() {
                if (this.running) {
                    this.running = false;
                    clearInterval(this.intervalId);
                    this.intervalId = null;
                    // Recalculate remaining precisely
                    const elapsed = performance.now() - this.startTime;
                    this.remaining = Math.max(0, this.initialRemaining - elapsed);
                    this.updateDisplay();
                    this.updateTimeAndCompletion();
                    this.updateUIState();
                    this.syncToFirebase();
                } else {
                    if (this.intervalId) {
                        clearInterval(this.intervalId);
                        this.intervalId = null;
                    }
                    this.updateUIState();
                }
            }

            reset() {
                this.pause();
                this.remaining = this.initialRemaining;
                this.updateDisplay();
                this.updateTimeAndCompletion();
                this.updateUIState();
                this.syncToFirebase();
            }

            addHours(hours) {
                const ms = hours * 3600000;
                this.remaining += ms;
                this.initialRemaining += ms;
                if (this.running) {
                    this.startTime = performance.now() - (this.initialRemaining - this.remaining);
                }
                this.updateDisplay();
                this.updateTimeAndCompletion();
                this.syncToFirebase();
                // Visual feedback
                this.btnAddHours.style.transform = 'scale(0.94)';
                setTimeout(() => { this.btnAddHours.style.transform = ''; }, 150);
            }

            tick() {
                const elapsed = performance.now() - this.startTime;
                let remaining = this.initialRemaining - elapsed;
                if (remaining <= 0) {
                    remaining = 0;
                    this.remaining = 0;
                    this.pause();
                    this.flashComplete();
                } else {
                    this.remaining = remaining;
                }
                this.updateDisplay();
                this.updateTimeAndCompletion();
                // Throttle Firebase sync to every 2 seconds to reduce writes
                if (Math.floor(Date.now() / 2000) % 2 === 0) {
                    this.syncToFirebase();
                }
            }

            flashComplete() {
                this.labelEl.textContent = '🎉 Time\'s up!';
                this.labelCtrl.textContent = '🎉 Time\'s up!';
                this.dotEl.className = 'status-dot finished';
                this.dotCtrl.className = 'status-dot finished';
                this.btnPause.disabled = true;
                this.btnContinue.disabled = true;
                this.syncToFirebase();
            }

            // ----- Display -----
            updateDisplay() {
                const total = Math.max(0, this.remaining);
                const hrs = Math.floor(total / 3600000);
                const mins = Math.floor((total % 3600000) / 60000);
                const secs = Math.floor((total % 60000) / 1000);
                const millis = Math.floor((total % 1000) / 10);
                const pad = (n, d = 2) => String(n).padStart(d, '0');
                const hStr = pad(hrs);
                const mStr = pad(mins);
                const sStr = pad(secs);
                const msStr = pad(millis);

                this.hEl.textContent = hStr;
                this.mEl.textContent = mStr;
                this.sEl.textContent = sStr;
                this.msEl.textContent = '.' + msStr;
                this.remainingView.textContent = `${hStr}:${mStr}:${sStr}`;

                this.hCtrl.textContent = hStr;
                this.mCtrl.textContent = mStr;
                this.sCtrl.textContent = sStr;
                this.msCtrl.textContent = '.' + msStr;
            }

            updateUIState() {
                const isRunning = this.running;
                const isFinished = this.remaining === 0 && this.initialRemaining > 0;
                const isReady = this.remaining > 0 && !isRunning;

                let statusText = 'Ready';
                let dotClass = 'status-dot';

                if (isRunning) {
                    statusText = 'Running';
                    dotClass += ' running';
                } else if (isFinished) {
                    statusText = '🎉 Time\'s up!';
                    dotClass += ' finished';
                } else if (isReady) {
                    statusText = 'Paused';
                    dotClass += ' paused';
                } else {
                    statusText = 'Set a target';
                    dotClass += ' paused';
                }

                this.labelEl.textContent = statusText;
                this.dotEl.className = dotClass;
                this.labelCtrl.textContent = statusText;
                this.dotCtrl.className = dotClass;

                this.btnPause.disabled = !isRunning;
                this.btnContinue.disabled = isRunning || isFinished || this.remaining <= 0;
            }

            updateTimeAndCompletion() {
                const now = new Date();
                const egyptTime = new Date(now.toLocaleString('en-US', { timeZone: 'Africa/Cairo' }));
                const timeStr = egyptTime.toTimeString().slice(0, 8);
                this.currentTimeView.textContent = timeStr;
                this.currentTimeCtrl.textContent = timeStr;

                const remaining = this.remaining;
                if (remaining <= 0 && this.initialRemaining > 0) {
                    const msg = '🎉 Time\'s up!';
                    this.completionView.textContent = msg;
                    this.completionView.className = 'value finished';
                    this.completionCtrl.textContent = msg;
                    this.completionCtrl.className = 'value finished';
                    return;
                }
                if (remaining <= 0) {
                    const msg = 'Set a target';
                    this.completionView.textContent = msg;
                    this.completionView.className = 'value';
                    this.completionCtrl.textContent = msg;
                    this.completionCtrl.className = 'value';
                    return;
                }
                const finishDate = new Date(egyptTime.getTime() + remaining);
                const finishStr = finishDate.toTimeString().slice(0, 8);
                this.completionView.textContent = finishStr;
                this.completionView.className = 'value';
                this.completionCtrl.textContent = finishStr;
                this.completionCtrl.className = 'value';
            }

            // ----- Routing -----
            setupRouting() {
                const viewPage = document.getElementById('page-view');
                const controlsPage = document.getElementById('page-controls');
                const navLinks = document.querySelectorAll('.nav-link');

                const navigate = (hash) => {
                    const page = hash.replace('#', '') || 'view';
                    const isView = page === 'view';
                    viewPage.classList.toggle('active', isView);
                    controlsPage.classList.toggle('active', !isView);
                    navLinks.forEach(link => {
                        const linkPage = link.dataset.page;
                        link.classList.toggle('active', linkPage === page);
                    });
                };

                navLinks.forEach(link => {
                    link.addEventListener('click', (e) => {
                        e.preventDefault();
                        const href = link.getAttribute('href');
                        history.pushState(null, '', href);
                        navigate(href);
                    });
                });

                window.addEventListener('popstate', () => {
                    navigate(window.location.hash || '#view');
                });
                window.addEventListener('hashchange', () => {
                    navigate(window.location.hash || '#view');
                });

                const initialHash = window.location.hash || '#view';
                if (!window.location.hash) {
                    history.replaceState(null, '', '#view');
                }
                navigate(initialHash);
            }
        }

        // ============================================================
        //  INIT
        // ============================================================
        const stopwatch = new CountdownTimer();

        window.addEventListener('beforeunload', () => {
            if (stopwatch.intervalId) clearInterval(stopwatch.intervalId);
            stopwatch.syncToFirebase();
        });
    </script>

</body>
</html>
